name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Get short commit id
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build app
        run: |
          xcodebuild -project noTunes.xcodeproj -scheme noTunes -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build

      - name: Create DMG
        run: |
          mkdir dmg-root
          cp -R build/Build/Products/Release/noTunes.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname noTunes -srcfolder dmg-root -ov -format UDZO \
            "noTunes-${{ steps.vars.outputs.short_sha }}.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: noTunes-dmg
          path: noTunes-*.dmg

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: noTunes-dmg

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ needs.build.outputs.short_sha }}" noTunes-*.dmg \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "noTunes ${{ needs.build.outputs.short_sha }}" \
            --generate-notes
